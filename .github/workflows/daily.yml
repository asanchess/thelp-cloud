name: Daily Telegram report
run-name: ${{ inputs.checks_only && 'Cloud verification (synthetic)' || inputs.smoke && 'Cloud collection and delivery check' || 'Daily Telegram report' }}
on:
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:
    inputs:
      checks_only:
        description: 'Run synthetic checks without private data or inference'
        type: boolean
        default: false
      smoke:
        description: 'Cloud collection/PDF/delivery check without AI'
        type: boolean
        default: false
      report_day:
        description: 'Optional completed date YYYY-MM-DD, otherwise yesterday UTC+5'
        type: string
        required: false
permissions:
  contents: write
concurrency:
  group: private-daily-telegram-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Validate code with synthetic data
        run: python -m unittest test_cloud test_reporting -q
      - name: Collect, verify, render and deliver privately
        if: ${{ !inputs.checks_only }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
          INPUT_SMOKE: ${{ inputs.smoke || 'false' }}
          REPORT_DAY: ${{ inputs.report_day || '' }}
        run: |
          args=()
          if [ "$INPUT_SMOKE" = "true" ]; then args+=(--smoke); fi
          if [ -n "$REPORT_DAY" ]; then args+=(--date "$REPORT_DAY"); fi
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then args+=(--wait); fi
          python cloud_run.py "${args[@]}"
